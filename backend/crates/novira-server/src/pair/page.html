<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>novira</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f6fb; --fg: #121826; --accent: #2f6fde; --muted: #5a6478; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1424; --fg: #e8ecf5; --accent: #6ea0ff; --muted: #a2acc0; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 28rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  label { display: block; margin: 1rem 0 0.25rem; color: var(--muted); }
  input { box-sizing: border-box; width: 100%; padding: 0.6rem; font: inherit; border-radius: 0.4rem; border: 1px solid var(--muted); background: transparent; color: inherit; }
  button { margin-top: 1rem; width: 100%; padding: 0.7rem; font: inherit; border: 0; border-radius: 0.4rem; background: var(--accent); color: #fff; }
  button:disabled { opacity: 0.5; }
  #confirm { font-size: 2.2rem; letter-spacing: 0.2em; text-align: center; margin: 1.5rem 0; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  details { margin-top: 1.5rem; }
  #ca-ios, #ca-android { white-space: pre-line; }
  summary { cursor: pointer; }
  code { overflow-wrap: anywhere; font-size: 0.85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p id="message" role="status"></p>
<p id="confirm" hidden></p>
<form id="form" hidden>
<label for="label" id="label-text"></label>
<input id="label" maxlength="40" autocomplete="off">
<button id="send" type="submit"></button>
</form>
<details id="ca-box">
<summary id="ca-title"></summary>
<p id="ca-why"></p>
<p><a id="ca" href="/ca.crt"></a></p>
<p id="ca-ios"></p>
<p id="ca-android"></p>
</details>
</main>
<script src="/pair.js"></script>
</body>
</html>
