# Version updates of Dependabot (docs/design/01-app/04-release/03-dependabot.md). The pull requests go to develop (target-branch; the working branch);
# .github/workflows/dependabot-triage.yml judges them.
# - cargo and npm: weekly; the minor and patch updates of an ecosystem in one pull request, which the triage merges once its checks
#   pass. A major update is a pull request of its own, which the triage closes for a person to read.
# - GitHub Actions: monthly, every update in one pull request (its title names no versions, so the triage leaves it for a person).
# - cooldown: a version is offered only seven days after it was published, so a release that is pulled again soon (a broken or a
#   malicious one) never becomes a pull request. Security updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    target-branch: develop
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore'
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ['*']
