# Version updates of Dependabot (docs/design/01-app/04-release/02-ci.md): one pull request a week per ecosystem, the minor and patch
# updates of an ecosystem together. The pull requests go to the default branch (main); .github/workflows/dependabot-triage.yml judges
# them. A major update is a pull request of its own, which the triage closes for a person to read.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
