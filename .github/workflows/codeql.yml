# Code scanning with CodeQL (docs/design/01-app/04-release/02-ci.md). It runs on every push to main (a release), on every pull request
# to main (a release; a draft only once it is ready for review), and every week on the default branch (develop). Nothing runs on a pull
# request into develop. The results are in the Security tab.
# It replaces GitHub's "default setup" (it cannot take the config that leaves the tests out): turn that off before this workflow's first run.
# The languages are those of the default setup. Nothing is built (`build-mode: none`). Only actions of GitHub's own are used.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # A draft runs nothing until it is ready for review (the Test workflow does the same).
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '29 4 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
