# Looks for known vulnerabilities in the dependencies that ship in the app: `cargo audit` over backend/Cargo.lock and
# `npm audit --omit=dev` over frontend/package-lock.json. It runs weekly, because an advisory appears without any change
# of ours, and on a push to main or release/** and a pull request to main that change a lock file. The advisories already judged are listed with their reasons
# in backend/.cargo/audit.toml; a new one fails the run (docs/design/01-app/04-release/02-ci.md).
# Only actions of GitHub's own (actions/*) are used; nothing here has a secret or write access.
name: Audit

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main, 'release/**']
    paths:
      - 'backend/Cargo.lock'
      - 'frontend/package-lock.json'
      - 'backend/.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Cargo.lock'
      - 'frontend/package-lock.json'
      - 'backend/.cargo/audit.toml'
      - '.github/workflows/audit.yml'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo-audit
        id: tool
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}

      - name: Install cargo-audit
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo audit
        working-directory: backend
        run: cargo audit

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit
        working-directory: frontend
        run: npm run audit
