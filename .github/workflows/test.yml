# The checks GitHub runs on every push to a branch (tags run release.yml instead), and every night on the default branch.
# The long jobs run only when the push changed what they read (scripts/tools/ci-scope.mjs); the default branch, the night
# and a manual run run all of them. It starts with the checks that read the
# sources and need no build, no browser and no Windows: types, lint, line ends, the product name, the docs and UI
# references, the term list, the changelog and the Rust formatting, then vitest, clippy, cargo test and the Playwright flows and phone layouts, and the mock against the real backend. The others
# (visual, layout scan) are added one by one once they are seen to pass on the runner (docs/design/01-app/04-release/02-ci.md).
# Only actions of GitHub's own (actions/*) are used; nothing here has a secret or write access.
name: Test

on:
  push:
    branches: ['**']
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which of the long jobs this push needs. The cheap jobs (static, rust-format) always run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      vitest: ${{ steps.scope.outputs.vitest }}
      rust: ${{ steps.scope.outputs.rust }}
      e2e: ${{ steps.scope.outputs.e2e }}
      diff: ${{ steps.scope.outputs.diff }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Which jobs the changed files need
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: node scripts/tools/ci-scope.mjs | tee -a "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      # Every check runs even when an earlier one failed, so one run shows all of them.
      - name: Types
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (ESLint, stylelint)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run lint

      - name: Line ends
        if: ${{ !cancelled() }}
        run: node scripts/tools/check-eol.mjs

      - name: Product name in lowercase
        if: ${{ !cancelled() }}
        run: node scripts/tools/check-name.mjs

      - name: The map and the design pages
        if: ${{ !cancelled() }}
        run: node scripts/tools/docs-check.mjs

      - name: Test ids and text keys the docs and scripts name
        if: ${{ !cancelled() }}
        run: node scripts/tools/ui-refs.mjs

      - name: Terms
        if: ${{ !cancelled() }}
        run: node frontend/scripts/check-glossary.mjs

      - name: Changelog
        if: ${{ !cancelled() }}
        run: node scripts/tools/changelog.mjs --check

  rust-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: cargo fmt --check
        working-directory: backend
        run: cargo fmt --all -- --check

  vitest:
    needs: changes
    if: ${{ needs.changes.outputs.vitest == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      # The runner has 4 cores: ten workers (vitest.config.ts) starve each other and four tests ran past the 5 s limit.
      - name: vitest
        working-directory: frontend
        shell: bash
        run: npx vitest run --maxWorkers=4 --testTimeout=30000 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"

      - name: Count of tests
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/tools/ci-summary.mjs vitest "vitest" "$RUNNER_TEMP/vitest.json" >> "$GITHUB_STEP_SUMMARY"

  clippy:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The build script of the app crate (`novira`) builds the frontend into frontend/dist.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}
          restore-keys: cargo-clippy-${{ runner.os }}-

      - name: cargo clippy
        working-directory: backend
        shell: cmd
        run: cargo clippy -p novira-core -p novira-server -p novira --tests -- -D warnings

  cargo-test:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}
          restore-keys: cargo-test-${{ runner.os }}-

      # --no-fail-fast: every test binary runs, so one run shows every failing test. The output is also kept in a log per
      # crate (tee), and the last step turns the logs into the count per test binary in the job summary.
      - name: cargo test novira-core
        working-directory: backend
        shell: bash
        run: cargo test -p novira-core --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/novira-core.log"

      - name: cargo test novira-server
        if: ${{ !cancelled() }}
        working-directory: backend
        shell: bash
        run: cargo test -p novira-server --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/novira-server.log"

      - name: cargo test novira
        if: ${{ !cancelled() }}
        working-directory: backend
        shell: bash
        run: cargo test -p novira --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/novira.log"

      - name: Count of tests
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/tools/ci-summary.mjs cargo "cargo test" "$RUNNER_TEMP/novira-core.log" "$RUNNER_TEMP/novira-server.log" "$RUNNER_TEMP/novira.log" >> "$GITHUB_STEP_SUMMARY"

  e2e-chromium:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages and Chromium
        working-directory: frontend
        shell: cmd
        run: |
          call npm ci
          if errorlevel 1 exit /b 1
          call npx playwright install chromium

      # The screen flows against the in-memory mock backend, with the a11y check (the `chromium` project; not the visual
      # regression, the phone layouts or the layout scan). The config runs half the cores, so two workers here.
      - name: Playwright chromium
        working-directory: frontend
        shell: cmd
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}\playwright-chromium.json
        run: npx playwright test --project=chromium --reporter=list,html,json

      - name: Count of tests
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/tools/ci-summary.mjs playwright "Playwright chromium" "$RUNNER_TEMP/playwright-chromium.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chromium
          path: |
            logs/playwright-report
            logs/e2e
          if-no-files-found: ignore
          retention-days: 7

  e2e-phone:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages, Chromium and WebKit
        working-directory: frontend
        shell: cmd
        run: |
          call npm ci
          if errorlevel 1 exit /b 1
          call npx playwright install chromium webkit

      # The phone layout (`phone*.spec.ts`) in Chromium as a Pixel 7 and in WebKit as an iPhone 14.
      - name: Playwright phone and webkit
        working-directory: frontend
        shell: cmd
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}\playwright-phone.json
        run: npx playwright test --project=phone --project=webkit --reporter=list,html,json

      - name: Count of tests
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/tools/ci-summary.mjs playwright "Playwright phone and webkit" "$RUNNER_TEMP/playwright-phone.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-phone
          path: |
            logs/playwright-report
            logs/e2e
          if-no-files-found: ignore
          retention-days: 7

  # The look of every screen in both themes against the committed baselines (`frontend/e2e/__screenshots__/visual/**/*-win32.png`),
  # which is why it runs on Windows. A change that moves a picture commits the new baselines with it
  # (`npm run e2e:visual -- --update-snapshots=changed`, looking at each).
  e2e-visual:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages and Chromium
        working-directory: frontend
        shell: cmd
        run: |
          call npm ci
          if errorlevel 1 exit /b 1
          call npx playwright install chromium

      - name: Playwright visual regression
        working-directory: frontend
        shell: cmd
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}playwright-visual.json
        run: npx playwright test --project=visual --reporter=list,html,json

      - name: Count of tests
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/tools/ci-summary.mjs playwright "Playwright visual regression" "$RUNNER_TEMP/playwright-visual.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report and the pictures of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual
          path: |
            logs/playwright-report
            logs/e2e
          if-no-files-found: ignore
          retention-days: 7

  diff-backends:
    needs: changes
    if: ${{ needs.changes.outputs.diff == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      # The tool builds novira-server into novira-data/work/server-target and the frontend into its harness build.
      - name: Cache the server build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            novira-data/work/server-target
          key: cargo-diff-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}
          restore-keys: cargo-diff-${{ runner.os }}-

      # The browser mock and the real backend (novira-server, no engine) get the same calls, and their answers are compared.
      - name: The mock against the real backend
        shell: cmd
        env:
          NOVIRA_VITEST_JSON: ${{ runner.temp }}\diff-backends.json
        run: node scripts/tools/diff-backends.mjs

      - name: Count of tests
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/tools/ci-summary.mjs vitest "The mock against the real backend" "$RUNNER_TEMP/diff-backends.json" >> "$GITHUB_STEP_SUMMARY"

  # Only at night: the screen flows three times without a retry, so a flow that passes only on its second try shows up.
  flaky:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages and Chromium
        working-directory: frontend
        shell: cmd
        run: |
          call npm ci
          if errorlevel 1 exit /b 1
          call npx playwright install chromium

      - name: Playwright chromium, three times without a retry
        working-directory: frontend
        shell: cmd
        run: npx playwright test --project=chromium --repeat-each=3 --retries=0 --reporter=list,html

      - name: Keep the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-flaky
          path: |
            logs/playwright-report
            logs/e2e
          if-no-files-found: ignore
          retention-days: 7
