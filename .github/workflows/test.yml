# The checks GitHub runs on every push to a branch (tags run release.yml instead). It starts with the checks that read the
# sources and need no build, no browser and no Windows: types, lint, line ends, the product name, the docs and UI
# references, the term list, the changelog and the Rust formatting, then vitest, clippy, cargo test and the Playwright flows. The others
# (phone, webkit, visual, layout scan) are added one by one once they are seen to pass on the runner (docs/design/ci.md).
# Only actions of GitHub's own (actions/*) are used; nothing here has a secret or write access.
name: test

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      # Every check runs even when an earlier one failed, so one run shows all of them.
      - name: Types
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (ESLint, stylelint)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run lint

      - name: Line ends
        if: ${{ !cancelled() }}
        run: node scripts/tools/check-eol.mjs

      - name: Product name in lowercase
        if: ${{ !cancelled() }}
        run: node scripts/tools/check-name.mjs

      - name: The map and the design pages
        if: ${{ !cancelled() }}
        run: node scripts/tools/docs-check.mjs

      - name: Test ids and text keys the docs and scripts name
        if: ${{ !cancelled() }}
        run: node scripts/tools/ui-refs.mjs

      - name: Terms
        if: ${{ !cancelled() }}
        run: node frontend/scripts/check-glossary.mjs

      - name: Changelog
        if: ${{ !cancelled() }}
        run: node scripts/tools/changelog.mjs --check

  rust-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: cargo fmt --check
        working-directory: backend
        run: cargo fmt --all -- --check

  vitest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      # The runner has 4 cores: ten workers (vitest.config.ts) starve each other and four tests ran past the 5 s limit.
      - name: vitest
        working-directory: frontend
        run: npx vitest run --maxWorkers=4 --testTimeout=30000

  clippy:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The build script of the app crate (`novira`) builds the frontend into frontend/dist.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}
          restore-keys: cargo-clippy-${{ runner.os }}-

      - name: cargo clippy
        working-directory: backend
        shell: cmd
        run: cargo clippy -p novira-core -p novira-server -p novira --tests -- -D warnings

  cargo-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}
          restore-keys: cargo-test-${{ runner.os }}-

      # --no-fail-fast: every test binary runs, so one run shows every failing test.
      - name: cargo test novira-core
        working-directory: backend
        shell: cmd
        run: cargo test -p novira-core --no-fail-fast

      - name: cargo test novira-server
        if: ${{ !cancelled() }}
        working-directory: backend
        shell: cmd
        run: cargo test -p novira-server --no-fail-fast

      - name: cargo test novira
        if: ${{ !cancelled() }}
        working-directory: backend
        shell: cmd
        run: cargo test -p novira --no-fail-fast

  e2e-chromium:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend packages and Chromium
        working-directory: frontend
        shell: cmd
        run: |
          call npm ci
          if errorlevel 1 exit /b 1
          call npx playwright install chromium

      # The screen flows against the in-memory mock backend, with the a11y check (the `chromium` project; not the visual
      # regression, the phone layouts or the layout scan). The config runs half the cores, so two workers here.
      - name: Playwright chromium
        working-directory: frontend
        shell: cmd
        run: npx playwright test --project=chromium

      - name: Keep the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
