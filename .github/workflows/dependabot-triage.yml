# Judges the open pull requests of Dependabot every few hours (scripts/tools/dependabot-triage.mjs, docs/design/01-app/04-release/02-ci.md):
# a minor or patch update whose Test, Supply chain and (when it ran) Audit workflows all passed is merged, a major update and a
# small one that stayed open for three weeks without passing are closed with the reason, the rest wait. A security update is never
# closed by this rule. A schedule runs on the default branch with this repository's own token, so it needs no secret.
# Only the `gh` command of the runner is used; no action other than actions/checkout.
name: Dependabot triage

on:
  schedule:
    - cron: '11 */4 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: Only list what would be done
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dependabot-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Judge the pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '--dry' || '' }}
        run: node scripts/tools/dependabot-triage.mjs $DRY
