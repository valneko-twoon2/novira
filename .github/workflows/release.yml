# Builds the Windows release the way scripts\release\package.bat does by hand, and leaves a DRAFT release for a person to
# read and publish (docs/design/01-app/04-release/01-release-workflow.md). It runs only when a tag v<version> is pushed. The release is titled
# with the tag, and its body is the tag's section of CHANGELOG.md (scripts/tools/changelog.mjs --notes).
# Only actions of GitHub's own (actions/*) are used, and every value that comes from outside (the tag name) reaches a
# script through an environment variable, never pasted into the script text.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      name: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/tools/package-release.mjs --check-tag "$TAG"

      - name: The changelog has the notes of the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/tools/changelog.mjs --notes "$TAG" --out "$RUNNER_TEMP/notes/release-notes.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the frontend packages and the browser the smoke test drives
        working-directory: frontend
        shell: cmd
        run: |
          call npm ci
          if errorlevel 1 exit /b 1
          call npx playwright install chromium

      - name: Build the release into artifacts
        shell: cmd
        run: call scripts\release\package.bat build

      - name: Smoke test what was built
        shell: cmd
        run: node scripts\tools\release-smoke.mjs

      - name: Pack the zip
        id: pack
        shell: cmd
        run: node scripts\tools\package-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            artifacts/novira-*-windows-x64.zip
            artifacts/novira-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          flags="--draft"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun: the release is already there (it may be published); only the files are replaced, the title and body stay.
            gh release upload "$TAG" dist/* --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" dist/* $flags --verify-tag --title "$TAG" --notes-file notes/release-notes.md
          fi
